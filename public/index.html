<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Crawler</title>
    <style>
        /* Стили из предыдущей версии + дополнения */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        
        .stat-card.success { border-left-color: #28a745; }
        .stat-card.warning { border-left-color: #ffc107; }
        .stat-card.danger { border-left-color: #dc3545; }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
        }
        
        .real-time-log {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            height: 200px;
            overflow-y: auto;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Advanced Web Crawler</h1>
        
        <div class="input-group">
            <label for="urlInput">URL сайта:</label>
            <input type="url" id="urlInput" placeholder="https://example.com" required>
        </div>
        
        <div class="input-group">
            <label for="maxPages">Максимум страниц:</label>
            <input type="number" id="maxPages" value="1000" min="1" max="10000">
        </div>
        
        <button id="crawlBtn" onclick="startCrawling()">Собрать список Страниц</button>
        <button id="stopBtn" onclick="stopCrawling()" style="display: none;">Остановить</button>
        
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info" id="progressInfo"></div>
        </div>

        <div class="real-time-log" id="logContainer" style="display: none;">
            <div id="logContent"></div>
        </div>
        
        <div class="stats-grid" id="statsGrid" style="display: none;"></div>
        
        <div class="result" id="result" style="display: none;">
            <button id="downloadBtn" onclick="downloadCSV()">📥 Скачать CSV</button>
            <button id="viewResultsBtn" onclick="viewResults()">👁️ Просмотреть результаты</button>
        </div>
        
        <div class="error" id="error"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
